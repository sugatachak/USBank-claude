spring.application.name=meeting-setup
server.port=8080

# H2 file-based database
spring.datasource.url=jdbc:h2:file:./data/meetingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=always

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS
cors.allowed-origins=http://localhost:5173

# Google Calendar
google.calendar.organizer=sugatachak@gmail.com
google.calendar.credentials-path=credentials.json
google.calendar.tokens-path=tokens
